; AutoHdrMode 設定（參數英文，說明中文）
[Main]
Language=auto
PollSeconds=1
StablePolls=3
AutoEnabled=1
Balloon=1
LogDir=
[PowerOff]
; 斷電後流程（結構與通電完全相同）
Enabled=1
DelayHDR=1
NativeHDR=off
VerifySeconds=2
CleanHelper=1
DelayAfterClean=5
Shell=
[PowerOn]
Enabled=1
DelayHDR=2
NativeHDR=on
VerifySeconds=2
CleanHelper=1
DelayAfterClean=5
Shell=
