;============================================================
; AutoHdrMode.ini — 與 exe 同目錄；改完請於設定窗按儲存或重開程式
; 斷電與通電結構相同，皆可獨立啟用／組合 HDR 與 Shell
;============================================================

[Main]
Language=auto
; 輪詢間隔秒數 1～30
PollSeconds=2
; 穩定確認次數：需連續幾次偵測結果相同才認定變更
StablePolls=3
; 自動總開關
AutoEnabled=1
LogDir=
Balloon=1

;------------------------------------------------------------
; 斷電（與通電相同可選項）
;------------------------------------------------------------
[PowerOff]
Enabled=1
DelayHDR=30
NativeHDR=off
VerifySeconds=5
CleanHelper=1
DelayAfterClean=2
Shell=
DelayShell=60
ShellTimeout=120
PollSeconds=3
StablePolls=8

;------------------------------------------------------------
; 通電（與斷電相同可選項）
;------------------------------------------------------------
[PowerOn]
Enabled=1
DelayHDR=1
NativeHDR=on
VerifySeconds=5
CleanHelper=1
DelayAfterClean=1
Shell=
DelayShell=0
ShellTimeout=120
PollSeconds=1
StablePolls=2
