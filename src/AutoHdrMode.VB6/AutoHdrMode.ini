; AutoHdrMode 設定與 exe 同目錄
[Main]
Language=auto
PollSeconds=3
StablePolls=2
AutoEnabled=1
Balloon=1
LogDir=

[PowerOff]
Enabled=1
DelayHDR=1
NativeHDR=off
VerifySeconds=5
CleanHelper=0
DelayAfterClean=2
Shell=

[PowerOn]
Enabled=1
DelayHDR=1
NativeHDR=on
VerifySeconds=5
CleanHelper=1
DelayAfterClean=8
Shell=
