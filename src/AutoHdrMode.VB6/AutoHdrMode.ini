; AutoHdrMode 設定（參數英文，說明中文）
[Main]
Language=auto
PollSeconds=1
StablePolls=3
AutoEnabled=1
LogDir=
[PowerOff]
; 斷電後：等幾秒，執行的 Shell（可空），原生 HDR 動作 on/off/空
DelaySeconds=3
Shell=
HdrAction=off
[PowerOn]
; 通電後：等幾秒，執行的 Shell（可空），原生 HDR 動作 on/off/空
; 驗證秒數：開完等幾秒再驗證；失敗且 CleanOnFail=1 就提權清卡重試
DelaySeconds=8
Shell=
HdrAction=on
VerifySeconds=10
CleanOnFail=1
